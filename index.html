<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141211" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Personal Trainee" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Personal Trainee</title>
    <style>
      /* Inline so the first paint is already dark — React replaces #root's content with <Splash>. */
      html, body { margin: 0; background: #141211; color: #f4efea; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 700 20px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.01em; }
      .boot > div { display: flex; flex-direction: column; align-items: center; }
      .boot img { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 16px; }
      .boot b { color: #f2783a; }
      .boot i { box-sizing: border-box; width: 16px; height: 16px; margin-top: 26px; border: 2px solid #2e2926; border-top-color: #f2783a; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><div><img src="/icons/favicon.svg" alt="" /><span>Personal <b>Trainee</b></span><i></i></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
